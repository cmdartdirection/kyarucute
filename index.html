<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Истоки</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="icon.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Major+Mono+Display&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      background-color: #faf7f2;
      color: #2c2c2c;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e8e4dc;
      }
    }

    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #faf7f2;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .splash-screen {
        background-color: #1e1e1e;
      }
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-stars-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .splash-stars {
      display: flex;
      flex-direction: row;
      gap: 0.6rem;
      align-items: center;
      justify-content: center;
    }

    .splash-star {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-family: 'Times New Roman', serif;
      color: #d6cdc0;
      user-select: none;
      pointer-events: none;
      filter: blur(0.5px);
      opacity: 0.06;
      transform: scale(0.85);
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    @media (prefers-color-scheme: dark) {
      .splash-star {
        color: #4a4a4a;
      }
    }

    @keyframes twinkle {
      0% { 
        opacity: 0.06; 
        transform: scale(0.85);
        filter: blur(1px);
      }
      30% {
        opacity: 0.5;
        transform: scale(1.0);
        filter: blur(0.4px);
      }
      60% {
        opacity: 0.25;
        transform: scale(0.92);
        filter: blur(0.7px);
      }
      100% { 
        opacity: 0.6; 
        transform: scale(1.05);
        filter: blur(0.3px);
      }
    }

    .progress-wrapper {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: clamp(150px, 30vw, 300px);
    }

    .progress-percent {
      font-size: clamp(0.8rem, 1.8vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #d6cdc0;
      opacity: 0.5;
      font-family: 'Playfair Display', serif;
    }

    @media (prefers-color-scheme: dark) {
      .progress-percent {
        color: #4a4a4a;
      }
    }

    .progress-container {
      width: 100%;
      height: 2px;
      background-color: rgba(214, 205, 192, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .progress-container {
        background-color: rgba(60, 60, 60, 0.25);
      }
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #d6cdc0;
      border-radius: 2px;
      transition: width 0.15s ease;
    }

    @media (prefers-color-scheme: dark) {
      .progress-bar {
        background-color: #4a4a4a;
      }
    }

    .main-content {
      opacity: 0;
      transition: opacity 1s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      padding: 1.2rem 1.8rem;
      position: relative;
      overflow: hidden;
      background-color: #faf7f2;
    }

    @media (prefers-color-scheme: dark) {
      .main-content {
        background-color: #1e1e1e;
      }
    }

    .main-content.visible {
      opacity: 1;
    }

    .noise-overlay {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      animation: noiseMove 0.5s steps(3) infinite;
    }

    @keyframes noiseMove {
      0% { transform: translate(0, 0); }
      33% { transform: translate(5%, -5%); }
      66% { transform: translate(-3%, 7%); }
      100% { transform: translate(0, 0); }
    }

    @media (prefers-color-scheme: dark) {
      .noise-overlay {
        opacity: 0.06;
      }
    }

    .timer-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-family: 'Major Mono Display', 'Courier New', monospace;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #d6cdc0;
      opacity: 0.5;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.3s ease;
      text-shadow: none;
      user-select: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.05em;
    }

    .timer-digit {
      display: inline-block;
      min-width: 0.6em;
      text-align: center;
      color: #d6cdc0;
    }

    .timer-separator {
      opacity: 0.5;
      margin: 0 0.05em;
      font-weight: 400;
      user-select: none;
      color: #d6cdc0;
    }

    @media (prefers-color-scheme: dark) {
      .timer-display {
        color: #4a4a4a;
      }
      .timer-digit {
        color: #4a4a4a;
      }
      .timer-separator {
        color: #4a4a4a;
      }
    }

    .telegram-link {
      position: absolute;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      opacity: 0.25;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .telegram-link:hover {
      opacity: 0.5;
      transform: translateX(-50%) scale(1.05);
    }

    .telegram-icon {
      width: clamp(28px, 3vw, 44px);
      height: clamp(28px, 3vw, 44px);
      fill: #d6cdc0;
      transition: fill 0.3s ease;
    }

    .telegram-link:hover .telegram-icon {
      fill: #c0b0a0;
    }

    @media (prefers-color-scheme: dark) {
      .telegram-icon {
        fill: #4a4a4a;
      }
      .telegram-link:hover .telegram-icon {
        fill: #6a6a6a;
      }
    }

    @media (max-width: 480px) {
      .splash-stars {
        gap: 0.3rem;
      }
      .splash-star {
        font-size: clamp(2rem, 10vw, 3.5rem);
      }
      .timer-display {
        font-size: clamp(1.6rem, 6vw, 2.6rem);
        letter-spacing: 0.04em;
      }
      .telegram-icon {
        width: clamp(24px, 5vw, 32px);
        height: clamp(24px, 5vw, 32px);
      }
      .progress-wrapper {
        width: clamp(100px, 40vw, 200px);
        bottom: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-stars-wrapper">
      <div class="splash-stars" id="splashStars">
        <span class="splash-star">✧</span>
        <span class="splash-star">✧</span>
        <span class="splash-star">✧</span>
        <span class="splash-star">✧</span>
        <span class="splash-star">✧</span>
        <span class="splash-star">✧</span>
      </div>
    </div>

    <div class="progress-wrapper">
      <div class="progress-percent" id="progressPercent">0%</div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="main-content" id="mainContent">
    <div class="noise-overlay"></div>

    <div class="timer-container">
      <div class="timer-display" id="timerDisplay"></div>
    </div>

    <a href="https://t.me/ProdByKyaru" target="_blank" class="telegram-link" id="telegramLink">
      <svg class="telegram-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
    </a>
  </div>

  <script>
    (function() {
      const splashScreen = document.getElementById('splashScreen');
      const splashStars = document.querySelectorAll('.splash-star');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const mainContent = document.getElementById('mainContent');
      const timerDisplay = document.getElementById('timerDisplay');

      function setRandomDelays(stars, minDelay = 0, maxDelay = 2.8) {
        stars.forEach(star => {
          const randomDelay = (Math.random() * (maxDelay - minDelay) + minDelay).toFixed(2);
          star.style.animationDelay = `${randomDelay}s`;
        });
      }
      setRandomDelays(splashStars, 0, 2.8);

      // ═══════════════════════════════════════════════════════════════
      // 🔽 УКАЖИТЕ ДАТУ ВЫХОДА ЗДЕСЬ (МОСКОВСКОЕ ВРЕМЯ) 🔽
      // Оставьте пустые кавычки '' для рандомного режима
      // ═══════════════════════════════════════════════════════════════
      const RELEASE_DATE = new Date(''); // например: new Date('2026-12-25T00:00:00+03:00')
      // ═══════════════════════════════════════════════════════════════

      const isReleaseDateValid = RELEASE_DATE && !isNaN(RELEASE_DATE.getTime()) && RELEASE_DATE.getTime() > Date.now();

      // ─── СОЗДАНИЕ ЦИФР ТАЙМЕРА ───
      const digitElements = [];

      function buildTimerStructure() {
        timerDisplay.innerHTML = '';
        digitElements.length = 0;

        const blocks = [
          { label: 'days', count: 2 },
          { label: 'hours', count: 2 },
          { label: 'minutes', count: 2 },
          { label: 'seconds', count: 2 }
        ];

        blocks.forEach((block, blockIndex) => {
          for (let i = 0; i < block.count; i++) {
            const span = document.createElement('span');
            span.className = 'timer-digit';
            span.textContent = '0';
            timerDisplay.appendChild(span);
            digitElements.push(span);
          }

          if (blockIndex < blocks.length - 1) {
            const sep = document.createElement('span');
            sep.className = 'timer-separator';
            sep.textContent = '|';
            timerDisplay.appendChild(sep);
          }
        });
      }

      buildTimerStructure();

      // ─── ОБНОВЛЕНИЕ ЦИФР ───
      function updateDigits(newDigits) {
        const digitArray = String(newDigits).padStart(8, '0').split('').map(Number);
        
        digitElements.forEach((el, index) => {
          const newVal = digitArray[index] || 0;
          el.textContent = newVal;
        });
      }

      // ─── ФОРМАТИРОВАНИЕ ───
      function formatTime(days, hours, minutes, seconds) {
        const clampedDays = Math.min(days, 99);
        return `${String(clampedDays).padStart(2, '0')}${String(hours).padStart(2, '0')}${String(minutes).padStart(2, '0')}${String(seconds).padStart(2, '0')}`;
      }

      function getRandomTimer() {
        const days = Math.floor(Math.random() * 100);
        const hours = Math.floor(Math.random() * 24);
        const minutes = Math.floor(Math.random() * 60);
        const seconds = Math.floor(Math.random() * 60);
        return { days, hours, minutes, seconds };
      }

      // ─── ПОЛУЧЕНИЕ СЛУЧАЙНОЙ ЦИФРЫ ───
      function getRandomDigit(block, position) {
        let max = 9;
        if (block === 'days') {
          max = 9;
        } else if (block === 'hours') {
          max = position === 0 ? 2 : 3;
        } else if (block === 'minutes' || block === 'seconds') {
          max = position === 0 ? 5 : 9;
        }
        return Math.floor(Math.random() * (max + 1));
      }

      // ─── ОБНОВЛЕНИЕ ТАЙМЕРА ───
      function updateTimer() {
        let newDigits = '';

        if (isReleaseDateValid) {
          const now = Date.now();
          let diff = RELEASE_DATE.getTime() - now;

          if (diff <= 0) {
            const random = getRandomTimer();
            newDigits = formatTime(random.days, random.hours, random.minutes, random.seconds);
          } else {
            const days = Math.floor(diff / 86400000);
            diff -= days * 86400000;
            const hours = Math.floor(diff / 3600000);
            diff -= hours * 3600000;
            const minutes = Math.floor(diff / 60000);
            diff -= minutes * 60000;
            const seconds = Math.floor(diff / 1000);
            newDigits = formatTime(days, hours, minutes, seconds);
          }
        } else {
          // ─── РАНДОМНЫЙ РЕЖИМ ───
          const blockTypes = ['days', 'days', 'hours', 'hours', 'minutes', 'minutes', 'seconds', 'seconds'];
          let result = '';
          blockTypes.forEach((block, index) => {
            const position = index % 2;
            const newDigit = getRandomDigit(block, position);
            result += newDigit;
          });
          newDigits = result;
        }

        updateDigits(newDigits);
      }

      // ─── ЗАПУСК ТАЙМЕРА ───
      updateTimer();

      // Замедленный интервал: 500мс для рандомного режима, 1000мс для реального
      const intervalTime = isReleaseDateValid ? 1000 : 500;
      setInterval(updateTimer, intervalTime);

      // ─── ИМИТАЦИЯ ЗАГРУЗКИ ───
      let progress = 0;
      const loadInterval = setInterval(() => {
        progress += 0.008 + Math.random() * 0.025;
        
        if (progress >= 1) {
          progress = 1;
          clearInterval(loadInterval);
          
          setTimeout(() => {
            splashScreen.classList.add('hidden');
            mainContent.classList.add('visible');
          }, 400);
        }
        
        const percent = Math.round(progress * 100);
        progressBar.style.width = `${percent}%`;
        progressPercent.textContent = `${percent}%`;
        
      }, 80);

      console.log('Разделители | того же цвета, замедленный таймер');
    })();
  </script>
</body>
</html>
