<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>kyarucute</title>
  <!-- Подключение шрифта Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    /* Сброс и базовые настройки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Запрещаем прокрутку */
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Тема по умолчанию (светлая) — будет переопределена медиа-запросом, но оставим как fallback */
    body {
      background-color: #ffffff;
      color: #000000;
    }

    /* Темная тема при предпочтении пользователя */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
        color: #ffffff;
      }
      /* дополнительно, если нужно изменить цвет акцентов — оставляем как есть */
    }

    /* Основной контейнер на весь экран */
    .site-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      padding: 2rem 2.5rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Хедер: слева */
    .header {
      font-size: clamp(2.2rem, 10vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      text-transform: lowercase; /* чтобы соответствовало "kyarucute.ru" */
    }

    /* Нижняя часть: слева, с анимированными точками */
    .footer-message {
      font-size: clamp(1.2rem, 5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 0.1rem;
      flex-wrap: wrap; /* на случай узких экранов */
    }

    .footer-message .static-text {
      white-space: nowrap;
    }

    .dots {
      display: inline-block;
      min-width: 2.2rem;  /* чтобы точки не сдвигали текст при изменении */
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.1em;
      transition: opacity 0.2s;
    }

    /* Дополнительно — убираем выделение, делаем поведение как у текста */
    .dots {
      user-select: none;
    }

    /* Небольшая адаптивность для очень маленьких экранов */
    @media (max-width: 480px) {
      .site-wrapper {
        padding: 1.5rem 1.2rem;
      }
      .dots {
        min-width: 1.6rem;
      }
    }

    /* Для красоты и сохранения пропорций */
    .footer-message .static-text {
      margin-right: 0.2rem;
    }

    /* Анимация для плавного изменения точек — реализована через JS, 
       но добавим небольшой эффект перехода для плавности */
    .dots {
      transition: opacity 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <!-- Верхний левый угол: kyarucute.ru -->
    <div class="header">kyarucute.ru</div>

    <!-- Нижний левый угол: "Тут скоро что-то появится..." + точки -->
    <div class="footer-message">
      <span class="static-text">Тут скоро что-то появится</span>
      <span class="dots" id="dots">...</span>
    </div>
  </div>

  <script>
    (function() {
      // Элемент для отображения точек
      const dotsElement = document.getElementById('dots');

      // Варианты состояний точек: от 1 до 3 точек
      const dotStates = ['...', '..', '.', '']; // пустая строка для эффекта "исчезновения" (опционально)
      // Используем три основных состояния: ... , .. , .
      // Чтобы было разнообразнее, добавим ещё и вариант с одной точкой, но можно сделать цикл из трёх.
      // Для большей плавности и соответствия "то меняющейся точкой" сделаем последовательность: ... -> .. -> . -> ... 
      // Можно также добавить "" (пусто) для эффекта, но по ТЗ "меняющаяся точка" — лучше три состояния.
      const states = ['...', '..', '.', '...', '..', '.']; // повтор для непрерывности
      
      let currentIndex = 0;
      let intervalId = null;

      // Функция обновления текста точек
      function updateDots() {
        if (!dotsElement) return;
        // Берём следующее состояние по кругу
        const nextState = states[currentIndex % states.length];
        dotsElement.textContent = nextState;
        currentIndex = (currentIndex + 1) % states.length;
      }

      // Запускаем интервал смены точек (каждые 500 мс — приятная скорость)
      function startAnimation() {
        if (intervalId) clearInterval(intervalId);
        // Устанавливаем начальное состояние ( ... )
        dotsElement.textContent = '...';
        currentIndex = 1; // чтобы следующим было '..' (индекс 1 в states)
        intervalId = setInterval(updateDots, 500);
      }

      // Останавливаем анимацию (если понадобится)
      function stopAnimation() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      // Запускаем анимацию при загрузке
      startAnimation();

      // (Опционально) перезапуск анимации при видимости — но не обязательно
      // Также можно добавить очистку интервала при уходе со страницы, но для простоты оставим

      // Обработчик изменения темы не требуется — это делает CSS через prefers-color-scheme.
      // Если нужно дополнительно реагировать на изменение темы в рантайме (например, при ручном переключении),
      // можно использовать MediaQueryList, но по ТЗ "зависимости от темы браузера" — CSS достаточно.

      // Дополнительно: чтобы быть уверенным, что при изменении темы на лету (в devtools) 
      // цвета меняются корректно — уже реализовано через CSS.
      // Небольшой бонус: при переключении темы вручную в браузере, фон меняется мгновенно.
      console.log('Сайт kyarucute.ru загружен. Тема определяется системой.');
    })();
  </script>
</body>
</html>
