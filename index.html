<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Истоки</title>
  <!-- Подключение шрифта Playfair Display для нижнего текста -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    /* Сброс и базовые настройки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Светлая тема — очень светлый песчаный фон */
    body {
      background-color: #faf7f2;
      color: #2c2c2c;
    }

    /* Темная тема при предпочтении пользователя */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e8e4dc;
      }
    }

    /* Основной контейнер на весь экран */
    .site-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      padding: 1.2rem 1.8rem;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }

    /* Центральные звезды — шесть штук в ряд, маленькие, почти невидимые */
    .center-stars {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.5rem, 8vw, 6rem); /* заметно меньше */
      color: #d6cdc0;
      opacity: 0.12;
      user-select: none;
      pointer-events: none;
      transition: color 0.3s ease, opacity 0.3s ease;
      line-height: 1;
      text-align: center;
      font-family: 'Times New Roman', serif;
      filter: blur(0.5px);
      letter-spacing: 0.15em;
      /* В ряд — убираем grid, используем обычный flex */
      display: flex;
      flex-direction: row;
      gap: 0.15rem;
      white-space: nowrap;
    }

    /* В темной теме делаем звезды чуть заметнее */
    @media (prefers-color-scheme: dark) {
      .center-stars {
        color: #3a3a3a;
        opacity: 0.15;
      }
    }

    /* Нижняя часть — "Тут скоро что-то появится..." + точки */
    .footer-message {
      position: absolute;
      bottom: 1.2rem;
      left: 1.8rem;
      font-size: clamp(0.65rem, 2vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      display: flex;
      align-items: baseline;
      gap: 0.05rem;
      flex-wrap: wrap;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .footer-message .static-text {
      white-space: nowrap;
    }

    .dots {
      display: inline-block;
      min-width: 1.2rem;
      text-align: left;
      font-weight: 500;
      letter-spacing: 0.12em;
      user-select: none;
      transition: opacity 0.15s ease;
    }

    /* Очень маленькие экраны */
    @media (max-width: 480px) {
      .site-wrapper {
        padding: 0.8rem 1rem;
      }
      .footer-message {
        bottom: 0.8rem;
        left: 1rem;
      }
      .dots {
        min-width: 0.9rem;
      }
      .center-stars {
        font-size: clamp(1.8rem, 10vw, 3.5rem);
        letter-spacing: 0.1em;
        gap: 0.1rem;
      }
    }

    /* Адаптация цветов для темной темы */
    @media (prefers-color-scheme: dark) {
      .footer-message {
        color: #c8c0b8;
      }
    }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <!-- 
      ═══════════════════════════════════════════════════════════════
      НАСТРОЙКА ЗВЕЗД:
      • Пустая звезда: ✧
      • Заполненная звезда: ✦
    ═══════════════════════════════════════════════════════════════
    -->
    <div class="center-stars">
      ✧✧✧✧✧✦
    </div>
    <!-- Нижний левый угол: "Тут скоро что-то появится..." + точки -->
    <div class="footer-message">
      <span class="static-text">Тут скоро что-то появится</span>
      <span class="dots" id="dots">.</span>
    </div>
  </div>

  <script>
    (function() {
      const dotsElement = document.getElementById('dots');

      const states = ['.', '..', '...'];
      let currentIndex = 0;
      let intervalId = null;

      function updateDots() {
        if (!dotsElement) return;
        dotsElement.textContent = states[currentIndex % states.length];
        currentIndex = (currentIndex + 1) % states.length;
      }

      function startAnimation() {
        if (intervalId) clearInterval(intervalId);
        dotsElement.textContent = '.';
        currentIndex = 1;
        intervalId = setInterval(updateDots, 500);
      }

      startAnimation();

      console.log('Шесть звезд в ряд — редактируемые, уменьшенные');
    })();
  </script>
</body>
</html>
