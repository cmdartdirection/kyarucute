<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>main</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Playfair Display', serif;
      color: #2c2c2c;
      overflow-y: scroll;
      scroll-behavior: smooth;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    .noise {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      animation: noiseMove 0.5s steps(3) infinite;
    }

    @keyframes noiseMove {
      0% { transform: translate(0, 0); }
      33% { transform: translate(5%, -5%); }
      66% { transform: translate(-3%, 7%); }
      100% { transform: translate(0, 0); }
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      padding: 0.8rem 1.2rem 0.6rem 1.2rem;
      z-index: 10;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      background-color: #faf7f2;
    }

    .header-top {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .header .logo {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #8a7a6a;
      opacity: 0.8;
      text-decoration: none;
      user-select: none;
      cursor: default;
    }

    .header-line {
      width: 100%;
      height: 1px;
      background: #a89888;
      opacity: 0.15;
      margin-top: 0.5rem;
    }

    .section-home {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      flex-shrink: 0;
      background-color: #faf7f2;
    }

    .center-text {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #6a5a4a;
      opacity: 0.7;
      text-align: center;
      line-height: 1.8;
      user-select: none;
    }

    .center-text .highlight {
      color: #6a5a4a;
      opacity: 0.9;
      font-weight: 400;
      text-decoration: none;
      border-bottom: 1px solid rgba(106, 90, 74, 0.15);
      transition: opacity 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .center-text .highlight:hover {
      opacity: 1;
      border-color: rgba(106, 90, 74, 0.4);
    }

    .section-projects {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      width: 100vw;
      flex-shrink: 0;
      padding: 2rem 1.2rem;
      gap: 0.8rem;
      background-color: #fcf9f5;
    }

    .projects-title {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #6a5a4a;
      opacity: 0.6;
      user-select: none;
      margin-bottom: 0.5rem;
    }

    .projects-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4rem;
      list-style: none;
      padding-left: 0;
    }

    .projects-list li {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #6a5a4a;
      opacity: 0.5;
      text-align: left;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .projects-list li:hover {
      opacity: 0.8;
    }

    .section-minecraft {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      flex-shrink: 0;
      padding: 2rem 1.2rem;
      gap: 1rem;
      background-color: #faf7f2;
    }

    .minecraft-title {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #6a5a4a;
      opacity: 0.6;
      user-select: none;
    }

    .minecraft-desc {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #6a5a4a;
      opacity: 0.5;
      max-width: 600px;
      text-align: center;
      line-height: 1.8;
    }

    .minecraft-btn {
      font-family: 'Cutive Mono', 'Courier New', monospace;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #6a5a4a;
      opacity: 0.5;
      background: none;
      border: 1px solid rgba(106, 90, 74, 0.2);
      padding: 0.6rem 1.8rem;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.3s ease, border-color 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .minecraft-btn:hover {
      opacity: 0.9;
      border-color: rgba(106, 90, 74, 0.5);
    }

    @media (max-width: 480px) {
      .header {
        padding: 0.6rem 0.8rem 0.4rem 0.8rem;
      }
      .header .logo {
        font-size: 1rem;
      }
      .header-line {
        margin-top: 0.3rem;
      }
      .center-text {
        font-size: 1rem;
        line-height: 1.8;
        padding: 0 1rem;
        opacity: 0.8;
      }
      .center-text .highlight {
        opacity: 1;
      }
      .projects-title {
        font-size: 1.4rem;
      }
      .projects-list li {
        font-size: 0.85rem;
      }
      .section-projects {
        padding: 1.2rem 0.8rem;
        gap: 0.6rem;
      }
      .section-minecraft {
        padding: 1.2rem 0.8rem;
        gap: 0.8rem;
      }
      .minecraft-title {
        font-size: 1.4rem;
      }
      .minecraft-desc {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <header class="header">
    <div class="header-top">
      <span class="logo">kyarucute.ru</span>
    </div>
    <div class="header-line"></div>
  </header>

  <section class="section-home" id="home">
    <div class="center-text">
      Это главная страница<br>
      перейдите в <span class="highlight" onclick="document.getElementById('projects').scrollIntoView({ behavior: 'smooth' })">Проекты</span>
    </div>
  </section>

  <section class="section-projects" id="projects">
    <div class="projects-title">проекты</div>
    <ul class="projects-list">
      <li onclick="document.getElementById('minecraft').scrollIntoView({ behavior: 'smooth' })">• майнкрафт сервер (подать заявку)</li>
    </ul>
  </section>

  <section class="section-minecraft" id="minecraft">
    <div class="minecraft-title">майнкрафт сервер</div>
    <div class="minecraft-desc">
      подайте заявку на вступление в наш закрытый сервер.<br>
      расскажите о себе и почему хотите присоединиться.
    </div>
    <a href="minecraft.html" class="minecraft-btn">подать заявку</a>
  </section>
</body>
</html>
